# Local stand-in for Tiger Cloud: Postgres 17 + TimescaleDB + PostGIS.
# Start: npm run db:up · Shell: npm run db:psql · Wipe: npm run db:reset
services:
  db:
    # Pinned so everyone gets the same TimescaleDB version. Check Tiger Cloud's version in V3 and keep them close.
    image: timescale/timescaledb-ha:pg17.12-ts2.32.1
    container_name: fogofwar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local only; never reuse for Tiger Cloud
      POSTGRES_DB: fogofwar
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata   # PGDATA for the -ha image is /home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fogofwar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
